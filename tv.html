<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ALHUDU TV</title>

<style>

*{box-sizing:border-box}

html,body{

width:100%;

height:100%;

margin:0;

overflow:hidden;

background:#000;

}

#screen{

position:fixed;

inset:0;

width:100vw;

height:100vh;

}

#screen img,#screen video{

width:100%;

height:100%;

object-fit:cover;

object-position:center;

display:block;

}

#status{

position:fixed;

inset:0;

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

background:#111;

color:#c8a66b;

font-family:Arial,sans-serif;

text-align:center;

}

#status h1{

font-size:clamp(30px,6vw,80px);

letter-spacing:8px;

}

</style>

</head>

<body>

<div id="screen"></div>

<div id="status">

<h1>ALHUDU</h1>

<p>Waiting for content...</p>

</div>

<script type="module">

import {firebaseConfig} from "./config.js";

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,

collection,

onSnapshot,

query,

orderBy

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp(firebaseConfig);

const db=getFirestore(app);

const screen=document.getElementById("screen");

const status=document.getElementById("status");

let playlist=[];

let index=0;

let timer=null;

let version=0;

function clearPlayback(){

version++;

if(timer)clearTimeout(timer);

timer=null;

screen.replaceChildren();

}

function showNext(){

clearPlayback();

if(!playlist.length){

status.style.display="flex";

status.querySelector("p").textContent="Waiting for content...";

return;

}

status.style.display="none";

index=index%playlist.length;

const item=playlist[index];

const token=version;

function next(){

if(token!==version)return;

index=(index+1)%playlist.length;

showNext();

}

if(item.type==="video"){

const video=document.createElement("video");

video.src=item.url;

video.autoplay=true;

video.muted=true;

video.playsInline=true;

video.preload="auto";

video.onended=next;

video.onerror=()=>{

timer=setTimeout(next,2500);

};

screen.append(video);

const playPromise=video.play();

if(playPromise){

playPromise.catch(()=>{

status.style.display="flex";

status.querySelector("p").textContent="Tap to play video";

status.onclick=()=>{

status.onclick=null;

video.play().then(()=>{

status.style.display="none";

}).catch(()=>{

timer=setTimeout(next,2500);

});

};

});

}

timer=setTimeout(next,180000);

}else{

const img=document.createElement("img");

img.src=item.url;

img.onerror=()=>{

if(token===version)next();

};

screen.append(img);

const seconds=Math.max(

3,

Math.min(120,Number(item.duration)||8)

);

timer=setTimeout(next,seconds*1000);

}

}

onSnapshot(

query(collection(db,"playlist"),orderBy("order")),

snapshot=>{

const updated=snapshot.docs.map(d=>({

id:d.id,

...d.data()

}));

if(JSON.stringify(updated)!==JSON.stringify(playlist)){

playlist=updated;

index=0;

showNext();

}

},

error=>{

clearPlayback();

status.style.display="flex";

status.querySelector("p").textContent=error.message;

}

);

</script>

</body>

</html>
