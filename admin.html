<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALHUDU TV | Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f0e8;color:#342b23;font-family:Arial,sans-serif}
header{background:#171717;color:#c9a86a;padding:22px;text-align:center}
h1{margin:0;letter-spacing:3px;font-size:26px}
main{max-width:650px;margin:auto;padding:20px}
section{background:white;padding:20px;border-radius:14px;margin:18px 0}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:15px}
input{border:1px solid #ddd}
button{background:#a88750;color:white;border:0;font-weight:bold}
button:disabled{opacity:.5}
.danger{background:#a64242}
.item{border-top:1px solid #eee;padding:14px 0}
.item img,.item video{max-width:100%;max-height:180px;display:block;margin:8px 0}
small{color:#777}
#panel{display:none}
</style>
</head>
<body>
<header><h1>ALHUDU TV</h1><small>CONTENT MANAGEMENT</small></header>
<main>
<section id="login">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button id="signIn">Sign In</button>
</section>
<div id="panel">
<section>
<h2>Upload Photo / Video</h2>
<input id="file" type="file" accept="image/*,video/mp4,video/webm">
<label>Photo duration (seconds)</label>
<input id="duration" type="number" min="3" max="120" value="8">
<button id="upload">Upload</button>
<p id="progress"></p>
</section>
<section>
<h2>Playlist</h2>
<p><small>Use arrows to change display order.</small></p>
<div id="playlist"></div>
</section>
<button id="logout">Log Out</button>
</div>
<p id="message"></p>
</main>
<script type="module">
import {firebaseConfig,cloudName,uploadPreset} from "./config.js";
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,deleteDoc,updateDoc,writeBatch,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp(firebaseConfig);
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const col=collection(db,"playlist");
let items=[],unsubscribe=null;
const message=e=>$("message").textContent=e?.message||String(e);
$("signIn").onclick=async()=>{
try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value)}
catch(e){message(e)}
};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
$("login").style.display=user?"none":"block";
$("panel").style.display=user?"block":"none";
if(unsubscribe){unsubscribe();unsubscribe=null}
if(user){
unsubscribe=onSnapshot(query(col,orderBy("order")),snapshot=>{
items=snapshot.docs.map(d=>({id:d.id,...d.data()}));
render();
},message);
}
});
$("upload").onclick=async()=>{
const file=$("file").files[0];
if(!file)return message("Choose a file");
if(!file.type.startsWith("image/")&&!file.type.startsWith("video/"))return message("Unsupported file");
if(file.size>90*1024*1024)return message("Maximum file size is 90 MB");
const btn=$("upload");btn.disabled=true;$("progress").textContent="Uploading...";
try{
const type=file.type.startsWith("video/")?"video":"image";
const body=new FormData();
body.append("file",file);
body.append("upload_preset",uploadPreset);
const response=await fetch("https://api.cloudinary.com/v1_1/"+cloudName+"/"+type+"/upload",{method:"POST",body});
const result=await response.json();
if(!response.ok)throw Error(result.error?.message||"Upload failed");
await addDoc(col,{url:result.secure_url,publicId:result.public_id,type,duration:Math.max(3,Math.min(120,Number($("duration").value)||8)),order:Date.now(),createdAt:Date.now()});
$("file").value="";
$("progress").textContent="Uploaded successfully";
}catch(e){$("progress").textContent=e.message}
finally{btn.disabled=false}
};
async function move(index,direction){
const other=index+direction;
if(other<0||other>=items.length)return;
const a=items[index],b=items[other],batch=writeBatch(db);
batch.update(doc(db,"playlist",a.id),{order:b.order});
batch.update(doc(db,"playlist",b.id),{order:a.order});
try{await batch.commit()}catch(e){message(e)}
}
function render(){
const root=$("playlist");root.replaceChildren();
for(let i=0;i<items.length;i++){
const item=items[i],box=document.createElement("div");box.className="item";
const media=document.createElement(item.type==="video"?"video":"img");
media.src=item.url;if(item.type==="video")media.controls=true;
box.append(media);
const info=document.createElement("p");info.textContent=(i+1)+". "+item.type;
box.append(info);
if(item.type==="image"){
const seconds=document.createElement("input");seconds.type="number";seconds.min=3;seconds.max=120;seconds.value=item.duration||8;
seconds.onchange=()=>updateDoc(doc(db,"playlist",item.id),{duration:Math.max(3,Math.min(120,Number(seconds.value)||8))}).catch(message);
box.append(seconds);
}
for(const [label,fn] of [["Move Up",()=>move(i,-1)],["Move Down",()=>move(i,1)],["Remove",async()=>{if(confirm("Remove this item from playlist?"))try{await deleteDoc(doc(db,"playlist",item.id))}catch(e){message(e)}}]]){
const button=document.createElement("button");button.textContent=label;
if(label==="Remove")button.className="danger";
button.onclick=fn;box.append(button);
}
root.append(box);
}
}
</script>
</body>
</html>
